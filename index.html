<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜單點單系統 / Menu Ordering System</title>
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 純白背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            padding: 30px 15px;
            max-width: 440px;
            margin: auto;
            min-height: 100vh;
            background-color: #ffffff;
            color: #1d1d1f;
        }

        /* 液體玻璃主卡片 (純白基底上的磨砂玻璃) */
        .card {
            background: rgba(245, 245, 247, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 28px 22px;
            border-radius: 28px;
            border: 1px solid rgba(220, 220, 230, 0.8);
            box-shadow: 
                0 12px 32px rgba(0, 0, 0, 0.05),
                inset 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        /* 透明文字效果 (適用於標題、標籤與選項) */
        .glass-text {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.85) 0%, rgba(100, 100, 100, 0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* 語言切換按鈕 */
        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(200, 200, 210, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            color: #444;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .lang-btn.active {
            background: rgba(88, 101, 242, 0.15);
            border-color: rgba(88, 101, 242, 0.4);
            color: #5865F2;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.15);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label.title {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        /* 液體玻璃輸入框 */
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(210, 210, 220, 0.6);
            border-radius: 14px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            outline: none;
            color: #333;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        input[type="text"]:focus, input[type="number"]:focus {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(88, 101, 242, 0.5);
            box-shadow: 0 0 12px rgba(88, 101, 242, 0.2);
        }

        input[type="number"]:disabled {
            background: rgba(230, 230, 230, 0.3);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .tip-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 8px;
            user-select: none;
        }

        /* 液體玻璃選單容器 */
        .item-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.45);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(220, 220, 230, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .item-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            padding: 4px 0;
        }

        .item-option label {
            cursor: pointer;
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 液體玻璃下拉選單 */
        .qty-select {
            width: 72px !important;
            padding: 5px 8px !important;
            margin-left: 10px;
            border-radius: 10px;
            border: 1px solid rgba(210, 210, 220, 0.6);
            background: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            color: #333;
        }

        /* 液體玻璃提交按鈕 (帶透明文字) */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(200, 200, 220, 0.8);
            border-radius: 18px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 
                0 8px 20px rgba(0, 0, 0, 0.06),
                inset 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        .submit-btn span {
            background: linear-gradient(135deg, #2c2c2e 0%, #6e6e73 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px);
            border-color: rgba(180, 180, 200, 0.9);
            box-shadow: 
                0 12px 25px rgba(0, 0, 0, 0.08),
                inset 0 1px 3px rgba(255, 255, 255, 1);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #5865F2;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="lang-switcher">
            <button class="lang-btn active" id="btn-zh" onclick="setLanguage('zh')">繁體中文</button>
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">English</button>
        </div>

        <h2 id="txt-title" class="glass-text">菜單點單</h2>

        <form id="orderForm">
            <div class="form-group">
                <label class="title glass-text" id="lbl-name" for="name">顧客稱呼</label>
                <input type="text" id="name" required placeholder="請輸入姓名或暱稱">
            </div>

            <!-- 預計送達時間 -->
            <div class="form-group">
                <label class="title glass-text" id="lbl-time" for="deliveryTime">🕒 預計送達時間</label>
                <input type="text" id="deliveryTime" placeholder="例如：18:30 或 盡快送達">
            </div>

            <!-- 飲品選擇 -->
            <div class="form-group">
                <label class="title glass-text" id="lbl-drinks">🥤 飲品選擇</label>
                <div class="item-group">
                    <div class="item-option"><label><input type="checkbox" name="item" value="lemon_tea"> <span class="item-name glass-text" data-zh="維他檸檬茶" data-en="Vita Lemon Tea">維他檸檬茶</span></label><select class="qty-select" data-item="lemon_tea"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="duck_shit_lemon_tea"> <span class="item-name glass-text" data-zh="鴨屎香檸檬茶" data-en="Ya Shi Xiang Lemon Tea">鴨屎香檸檬茶</span></label><select class="qty-select" data-item="duck_shit_lemon_tea"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="cc_lemon"> <span class="item-name glass-text" data-zh="CC檸檬" data-en="C.C. Lemon">CC檸檬</span></label><select class="qty-select" data-item="cc_lemon"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="blue_scream"> <span class="item-name glass-text" data-zh="藍色尖叫" data-en="Scream Sports Drink (Blue)">藍色尖叫</span></label><select class="qty-select" data-item="blue_scream"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="coke"> <span class="item-name glass-text" data-zh="可口可樂" data-en="Coca-Cola">可口可樂</span></label><select class="qty-select" data-item="coke"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="sprite"> <span class="item-name glass-text" data-zh="雪碧" data-en="Sprite">雪碧</span></label><select class="qty-select" data-item="sprite"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="nestea_lemon_tea"> <span class="item-name glass-text" data-zh="雀巢檸檬茶" data-en="Nestea Lemon Tea">雀巢檸檬茶</span></label><select class="qty-select" data-item="nestea_lemon_tea"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="nestea_ice_rush"> <span class="item-name glass-text" data-zh="雀巢冰極檸檬茶" data-en="Nestea Ice Rush Lemon Tea">雀巢冰極檸檬茶</span></label><select class="qty-select" data-item="nestea_ice_rush"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                </div>
            </div>

            <!-- 零食選擇 -->
            <div class="form-group">
                <label class="title glass-text" id="lbl-snacks">🍿 零食選擇</label>
                <div class="item-group">
                    <div class="item-option"><label><input type="checkbox" name="item" value="lays_truffle"> <span class="item-name glass-text" data-zh="黑松露薯片（樂事）" data-en="Lay's Black Truffle Chips">黑松露薯片（樂事）</span></label><select class="qty-select" data-item="lays_truffle"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="pringles_sour_cream"> <span class="item-name glass-text" data-zh="酸忌廉洋蔥薯片（品客）" data-en="Pringles Sour Cream & Onion Chips">酸忌廉洋蔥薯片（品客）</span></label><select class="qty-select" data-item="pringles_sour_cream"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="takis"> <span class="item-name glass-text" data-zh="TAKIS" data-en="Takis">TAKIS</span></label><select class="qty-select" data-item="takis"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="calbee_hot_wave"> <span class="item-name glass-text" data-zh="卡樂B熱浪薯片" data-en="Calbee Hot Wave Chips">卡樂B熱浪薯片</span></label><select class="qty-select" data-item="calbee_hot_wave"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="grill_corn_spicy"> <span class="item-name glass-text" data-zh="卡樂B粟一燒（辣味）" data-en="Calbee Grill Corn (Spicy)">卡樂B粟一燒（辣味）</span></label><select class="qty-select" data-item="grill_corn_spicy"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="konjac_spicy"> <span class="item-name glass-text" data-zh="魔芋爽（香辣味）" data-en="Konjac Snack (Spicy)">魔芋爽（香辣味）</span></label><select class="qty-select" data-item="konjac_spicy"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="konjac_numbing_spicy"> <span class="item-name glass-text" data-zh="魔芋爽（麻辣味）" data-en="Konjac Snack (Mala Spicy)">魔芋爽（麻辣味）</span></label><select class="qty-select" data-item="konjac_numbing_spicy"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div class="item-option"><label><input type="checkbox" name="item" value="konjac_sour_spicy"> <span class="item-name glass-text" data-zh="魔芋爽（酸辣味）" data-en="Konjac Snack (Sour & Spicy)">魔芋爽（酸辣味）</span></label><select class="qty-select" data-item="konjac_sour_spicy"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                </div>
            </div>

            <!-- 小費輸入區 -->
            <div class="form-group">
                <label class="tip-checkbox-label">
                    <input type="checkbox" id="enableTip">
                    <span id="lbl-tip-check" class="glass-text">🪙 我要給予小費</span>
                </label>
                <input type="number" id="tipAmount" min="1" step="1" disabled placeholder="請勾選後輸入小費金額">
            </div>

            <button type="submit" class="submit-btn" id="btn-submit">
                <span id="txt-btn-submit">確認送出</span>
            </button>
        </form>
    </div>

    <script>
        // 請將下方字串替換成您自己的 Discord Webhook URL
        const DISCORD_WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

        let currentLang = 'zh';

        const translations = {
            zh: { 
                title: "菜單點單", 
                lblName: "顧客稱呼", 
                inputNamePlaceholder: "請輸入姓名或暱稱", 
                lblTime: "🕒 預計送達時間",
                inputTimePlaceholder: "例如：18:30 或 盡快送達",
                lblDrinks: "🥤 飲品選擇", 
                lblSnacks: "🍿 零食選擇", 
                lblTipCheck: "🪙 我要給予小費",
                inputTipPlaceholder: "請勾選後輸入小費金額",
                fieldTipName: "🪙 小費金額",
                noTipText: "無小費",
                btnSubmit: "確認送出", 
                alertNoSelect: "請至少選擇一項飲品或零食！", 
                alertSuccess: "🎉 點單成功！店家已收到通知。",
                fieldTimeName: "🕒 預計送達時間"
            },
            en: { 
                title: "Menu Order", 
                lblName: "Your Name", 
                inputNamePlaceholder: "Enter your name or nickname", 
                lblTime: "🕒 Delivery Time",
                inputTimePlaceholder: "e.g., 18:30 or As soon as possible",
                lblDrinks: "🥤 Drinks", 
                lblSnacks: "🍿 Snacks", 
                lblTipCheck: "🪙 I'd like to leave a tip",
                inputTipPlaceholder: "Check the box to enter tip amount",
                fieldTipName: "🪙 Tip Amount",
                noTipText: "No tip",
                btnSubmit: "Submit Order", 
                alertNoSelect: "Please select at least one drink or snack!", 
                alertSuccess: "🎉 Order submitted successfully!",
                fieldTimeName: "🕒 Expected Delivery Time"
            }
        };

        const enableTipCheckbox = document.getElementById('enableTip');
        const tipAmountInput = document.getElementById('tipAmount');

        enableTipCheckbox.addEventListener('change', function() {
            tipAmountInput.disabled = !this.checked;
            if (!this.checked) {
                tipAmountInput.value = '';
            } else {
                tipAmountInput.focus();
            }
        });

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('lbl-name').innerText = t.lblName;
            document.getElementById('name').placeholder = t.inputNamePlaceholder;
            document.getElementById('lbl-time').innerText = t.lblTime;
            document.getElementById('deliveryTime').placeholder = t.inputTimePlaceholder;
            document.getElementById('lbl-drinks').innerText = t.lblDrinks;
            document.getElementById('lbl-snacks').innerText = t.lblSnacks;
            document.getElementById('lbl-tip-check').innerText = t.lblTipCheck;
            document.getElementById('tipAmount').placeholder = t.inputTipPlaceholder;
            document.getElementById('txt-btn-submit').innerText = t.btnSubmit;
            document.querySelectorAll('.item-name').forEach(span => { span.innerText = span.getAttribute(`data-${lang}`); });
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const t = translations[currentLang];
            const name = document.getElementById('name').value;
            const deliveryTime = document.getElementById('deliveryTime').value.trim() || '未填寫 / Not specified';
            
            let tipText = t.noTipText;
            if (enableTipCheckbox.checked && tipAmountInput.value.trim() !== '') {
                tipText = `$${tipAmountInput.value.trim()}`;
            }

            let selectedItems = [];

            const checkboxes = document.querySelectorAll('input[name="item"]:checked');
            if (checkboxes.length === 0) {
                alert(t.alertNoSelect);
                return;
            }

            checkboxes.forEach(cb => {
                const itemSpan = cb.parentElement.querySelector('.item-name');
                const itemName = itemSpan.getAttribute(`data-${currentLang}`);
                const itemOptionDiv = cb.closest('.item-option');
                const qtySelect = itemOptionDiv ? itemOptionDiv.querySelector('.qty-select') : null;
                const qty = qtySelect ? qtySelect.value : 1;
                selectedItems.push(`• ${itemName} x ${qty}`);
            });

            const payload = {
                content: "🚨 **新點單！**",
                embeds: [{
                    title: "🛒 訂單明細",
                    color: 5793266,
                    fields: [
                        { name: "👤 顧客稱呼", value: name, inline: true },
                        { name: t.fieldTimeName, value: deliveryTime, inline: true },
                        { name: t.fieldTipName, value: tipText, inline: true },
                        { name: "📋 點單內容", value: selectedItems.join("\n"), inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(async response => {
                if (response.ok) {
                    alert(t.alertSuccess);
                    document.getElementById('orderForm').reset();
                    tipAmountInput.disabled = true;
                } else {
                    const errorMsg = await response.text();
                    alert(`發送失敗！\nHTTP代碼: ${response.status}\n原因: ${errorMsg}`);
                }
            }).catch(err => {
                alert(`網路或連線錯誤：${err.message}`);
            });
        });
    </script>
</body>
</html>
